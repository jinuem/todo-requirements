name: Trigger Agent Workflows

on:
  push:
    branches: [init]
  workflow_dispatch:

jobs:
  trigger-agents:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Frontend Agent
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: jinuem/todo-frontend
          event-type: requirements_updated
          
      - name: Trigger Backend Agent
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: jinuem/todo-backend
          event-type: requirements_updated
